name: CI

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-policy:
    name: PR policy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Capture CI PR metadata
        run: |
          python3 tools/ci/pr_metadata.py capture \
            --event-path "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/pr-metadata.json" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload CI PR metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            --paginate \
            --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > /tmp/pr-files.json

      - name: Check PR policy
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
          PR_FILES_PATH: /tmp/pr-files.json
        run: |
          python3 tools/ci/pr_policy.py

      - name: Check no stale auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json autoMergeRequest \
            > /tmp/pr-auto-merge.json

          if ! jq -e '.autoMergeRequest == null' \
            /tmp/pr-auto-merge.json \
            > /dev/null; then
            echo "pr-policy: stale auto-merge request remains" >&2
            exit 1
          fi

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check newly introduced repository-policy violations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 tools/ci/check_repo.py \
            --baseline-ref "$BASE_SHA" \
            --candidate-ref "$GITHUB_SHA"

      - name: Check candidate LFS object integrity
        id: lfs-integrity
        run: |
          python3 tools/ci/check_lfs_integrity.py \
            --candidate-ref "$GITHUB_SHA" \
            --fetch-remote origin \
            --output "$RUNNER_TEMP/lfs-integrity.json"

      - name: Upload candidate LFS integrity evidence
        if: always() && steps.lfs-integrity.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lfs-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lfs-integrity.json
          if-no-files-found: error
          retention-days: 30

  template-tests:
    name: Template tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install -r tools/tests/requirements.txt

      - run: |
          python3 -m unittest discover \
            -s tools/tests \
            -p 'test_*.py'

  # Add each required project job to both needs and REQUIRED_TEST_JOBS.
  # See docs/CI.md. Every dependency must provide successful evidence.
  tests:
    name: Tests
    if: ${{ always() }}
    needs: [template-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUIRED_TEST_JOBS: '["template-tests"]'
      TEST_JOB_RESULTS: ${{ toJSON(needs) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Require all test job results
        run: python3 tools/ci/aggregate_tests.py

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA"
