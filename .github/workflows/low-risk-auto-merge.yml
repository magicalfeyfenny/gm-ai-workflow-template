name: Low-risk auto-merge

on:
  pull_request_target:
    types:
      - synchronize
      - edited
      - labeled
      - unlabeled
      - converted_to_draft

  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions: {}

jobs:
  cancel:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Revoke pending auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 -m tools.ci.low_risk_merge cancel \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request-number "$PR_NUMBER"

  merge:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Create governed merge token
        id: governed-merge-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GOVERNED_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GOVERNED_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Revalidate and merge
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ steps.governed-merge-token.outputs.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          CI_HEAD: ${{ github.event.workflow_run.head_sha }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 -m tools.ci.low_risk_merge merge \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request-number "$PR_NUMBER" \
            --head-sha "$CI_HEAD" \
            --conclusion "$CI_CONCLUSION" \
            --run-id "$CI_RUN_ID" \
            --run-attempt "$CI_RUN_ATTEMPT"
