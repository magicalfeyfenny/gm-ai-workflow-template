name: Work item
description: Define one coherent repository outcome.
labels: []
assignees: []

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should change?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable product or integration outcomes must be true for this work to be complete? Prefer outcomes over implementation mechanisms. Do not list tests, routine repository checks, or generic engineering invariants here.
    validations:
      required: true

  - type: textarea
    id: engineering-constraints
    attributes:
      label: Engineering constraints
      description: Feature-specific implementation properties that must be preserved, such as determinism, stable identities, lifecycle or ownership invariants, compatibility boundaries, or asset-authority requirements. Leave blank when normal repository policy is sufficient.
    validations:
      required: false

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Representative feature-specific evidence needed to establish the acceptance criteria or engineering constraints. Do not repeat the repository-wide governed validation suite.
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: One independently meaningful outcome and its boundaries. Include all technical layers needed to deliver that outcome. Split only independently valuable outcomes.
    validations:
      required: true

  - type: dropdown
    id: expected-risk
    attributes:
      label: Expected risk
      description: Classify this issue's own scope; do not inherit risk from a parent issue.
      options:
        - Low
        - High
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Prior implementations, designs, related issues, or source evidence.
    validations:
      required: false
