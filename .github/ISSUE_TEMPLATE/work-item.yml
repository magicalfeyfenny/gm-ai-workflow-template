name: Work item
description: Define one atomic repository change.
labels: []
assignees: []

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should change?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: What must be true when this is complete?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: One independently completable outcome and its boundaries. Split separable outcomes into linked issues.
    validations:
      required: true

  - type: dropdown
    id: expected-risk
    attributes:
      label: Expected risk
      description: Classify this issue's own scope; do not inherit risk from a parent issue.
      options:
        - Low
        - High
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Prior implementations, designs, related issues, or source evidence.
    validations:
      required: false
