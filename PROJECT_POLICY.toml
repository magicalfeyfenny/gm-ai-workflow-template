version = 1

[structure]
max_source_lines = 800

source_extensions = [
    ".gml",
    ".vsh",
    ".fsh",
    ".py",
    ".sh",
    ".js",
    ".jsx",
    ".ts",
    ".tsx",
    ".cs",
]

forbidden_generic_stems = [
    "helper",
    "helpers",
    "util",
    "utils",
    "misc",
    "common",
]

# Exact repository-relative files from pinned, read-only imported libraries.
# Each listed file bypasses every source-structure check; entries are not globs
# and do not match directories, prefixes, or neighboring files.
large_file_exceptions = []

[assets]
manifest = "assets/exports.json"
content_root = "content"
plain_runtime_svg = true

# Roots belong to each pipeline. Dedicated runtime roots require complete export
# coverage; native resource roots are shared and validate only listed exports.
# Extension lists allow alternatives. Add required_source_extensions or
# required_runtime_extensions only for concrete companion-deliverable contracts.
[assets.pipelines.vector]
source_roots = ["assets/source"]
runtime_roots = ["assets/runtime"]
native_resource_roots = []
source_extensions = [".svg"]
runtime_extensions = [".svg"]

[assets.pipelines.raster]
source_roots = ["assets/source"]
runtime_roots = ["assets/runtime"]
native_resource_roots = []
source_extensions = [".kra"]
runtime_extensions = [".png"]

[assets.pipelines.music]
source_roots = ["assets/source"]
runtime_roots = ["assets/runtime"]
native_resource_roots = []
source_extensions = [".mid", ".logicx"]
runtime_extensions = [".flac"]
sample_rate = 48000
channels = 2

[assets.pipelines.sound_effect]
source_roots = ["assets/source"]
runtime_roots = ["assets/runtime"]
native_resource_roots = []
source_extensions = [".logicx"]
runtime_extensions = [".wav"]
sample_rate = 48000
channels = 2

[assets.pipelines.model_3d]
source_roots = ["assets/source"]
runtime_roots = ["assets/runtime"]
native_resource_roots = []
source_extensions = [".blend", ".obj", ".mtl"]
runtime_extensions = [".vbuff"]

[risk]
max_changed_files = 100
max_changed_lines = 10000

high_risk_paths = [
    ".github/actions/**",
    ".github/rulesets/**",
    ".github/workflows/**",
    ".agents/skills/**",
    ".gitattributes",
    "AGENTS.md",
    "GOVERNANCE.md",
    "PROJECT_POLICY.toml",
    "docs/SETUP.md",
    "templates/codex/**",
    "tools/assets/**",
    "tools/ci/**",
    "tools/setup_github.py",
]
